[project]
name = "twitter_openapi_python"
version = "0.1.5"
description = "Twitter OpenAPI"
authors = [{ name = "fa0311", email = "yuki@yuki0311.com" }]
readme = "README.md"
license = "LicenseRef-Custom OR AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.AGPL"]
keywords = ["twitter", "api", "python", "scraper"]
requires-python = ">=3.10"
dependencies = [
    "twitter_openapi_python_generated==0.1.4",
    "pydantic>=2.6",
    "requests>=2.31.0,<3.0.0",
    "urllib3>=2.1.0,<3.0.0",
    "xclienttransaction>=1.0.1,<2.0.0",
]

[project.urls]
Repository = "https://github.com/fa0311/twitter_openapi_python"

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[tool.uv.sources]
twitter_openapi_python_generated = { path = "../twitter_openapi_python_generated", editable = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "twitter_openapi_python"
module-root = ""

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.pyright]
extraPaths = ["../twitter_openapi_python_generated"]
reportPrivateImportUsage = false
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
