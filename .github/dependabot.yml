version: 2
updates:
  - package-ecosystem: uv
    directory: /twitter_openapi_python
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: uv
    directory: /twitter_openapi_python_generated
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
